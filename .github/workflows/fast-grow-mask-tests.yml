name: Fast Grow Mask tests

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
        python-version: ["3.10"]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        run: >-
          python -m pip install
          --index-url https://download.pytorch.org/whl/cpu
          torch==2.5.1
      - name: Install image dependencies
        run: python -m pip install "numpy<2" "pillow>=10.3.0"
      - name: Compile changed Python modules
        run: >-
          python -m py_compile
          utility/fast_mask.py
          nodes/mask_nodes.py
          tests/test_fast_mask.py
      - name: Run algorithm compatibility tests
        run: python -m unittest discover -s tests -v
